<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Jarno Dirksen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header"></div>
        
    <section id="books">
        <h2>My Books</h2>
        <div id="read">
            <h3>Read</h3>
            <div class="book-list"></div>
        </div>
        <div id="reading">
            <h3>Currently Reading</h3>
            <div class="book-list"></div>
        </div>
        <div id="want-to-read">
            <h3>Want to Read</h3>
            <div class="book-list"></div>
        </div>
    </section>

    <!-- Statistics Section -->
    <section id="stats">
        <h2>Reading Statistics</h2>
        <p>Total Books Read: <span id="totalRead">0</span></p>
        <p>Total Pages Read: <span id="totalPagesRead">0</span></p>
        <p>Average Pages per Book: <span id="avgPages">0</span></p>
        <p>Total Pages Read in 2026: <span id="totalPages2026">0</span></p>
    </section>

    <!-- Modal Structure -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="book-details">
                <img id="modalCover" src="" alt="Book Cover">
                <div class="book-info">
                    <h3 id="modalTitle"></h3>
                    <p><strong>Author:</strong> <span id="modalAuthor"></span></p>
                    <p><strong>Genre:</strong> <span id="modalGenre"></span></p>
                    <p><strong>Author Info:</strong> <span id="modalAuthorInfo"></span></p>
                    <p><strong>Start Date:</strong> <span id="modalStartDate"></span></p>
                    <p><strong>End Date:</strong> <span id="modalEndDate"></span></p>
                    <p><strong>Pages:</strong> <span id="modalPages"></span></p>
                    <p><strong>Notes:</strong> <span id="modalNotes"></span></p>
                    <p><strong>Grade:</strong> <span id="modalGrade"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="books.js"></script>
     
    <!-- Footer Placeholder -->
    <div id="footer"></div>

     <!-- Script to Load Header and Footer -->
     <script>
         fetch('header.html')
             .then(response => response.text())
             .then(data => {
                 document.getElementById('header').innerHTML = data;
             });
         fetch('footer.html')
             .then(response => response.text())
             .then(data => {
                 document.getElementById('footer').innerHTML = data;
             });
     </script>

</html>
